<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Неонова Змійка | Neon Snake Arcade</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Font Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800;900&display=swap" rel="stylesheet">
    
    <style>
        * {
            font-family: 'Outfit', sans-serif;
            touch-action: manipulation;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            background-color: #7FFF00;
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(99, 102, 241, 0.15) 0%, transparent 70%),
                radial-gradient(circle at 0% 100%, rgba(236, 72, 153, 0.1) 0%, transparent 50%);
            min-height: 100vh;
            overflow-x: hidden;
        }

        .glass-panel {
            background: rgba(17, 24, 39, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .glow-box-cyan {
            box-shadow: 0 0 25px rgba(6, 182, 212, 0.35);
        }

        .glow-box-pink {
            box-shadow: 0 0 25px rgba(236, 72, 153, 0.35);
        }

        canvas {
            image-rendering: pixelated;
            border-radius: 1rem;
            box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.8), 0 0 30px rgba(99, 102, 241, 0.2);
        }

        /* D-Pad Buttons styling */
        .dpad-btn {
            background: rgba(30, 41, 59, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(8px);
            transition: all 0.1s ease;
        }

        .dpad-btn:active {
            transform: scale(0.92);
            background: rgba(99, 102, 241, 0.4);
            border-color: rgba(129, 140, 248, 0.6);
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(15, 23, 42, 0.6);
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(99, 102, 241, 0.5);
            border-radius: 3px;
        }
    </style>
</head>
<body class="text-slate-100 flex flex-col justify-between items-center min-h-screen p-2 sm:p-4">

    <!-- Header Section -->
    <header class="w-full max-w-lg flex items-center justify-between my-2 px-2">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-cyan-500 to-indigo-500 flex items-center justify-center text-xl shadow-lg shadow-cyan-500/30">
                <i class="fa-solid fa-worm"></i>
            </div>
            <div>
                <h1 class="text-xl sm:text-2xl font-extrabold tracking-wide bg-clip-text text-transparent bg-gradient-to-r from-cyan-400 via-indigo-300 to-pink-500">
                    НЕОНОВА ЗМІЙКА
                </h1>
                <p class="text-xs text-slate-400 font-medium">Arcade Edition 2026</p>
            </div>
        </div>

        <button id="soundToggleBtn" class="w-10 h-10 rounded-xl glass-panel flex items-center justify-center text-slate-300 hover:text-white transition-all active:scale-95">
            <i id="soundIcon" class="fa-solid fa-volume-high text-cyan-400"></i>
        </button>
    </header>

    <!-- Score & Stats Bar -->
    <div class="w-full max-w-lg grid grid-cols-3 gap-2 mb-3">
        <div class="glass-panel p-2.5 rounded-2xl flex flex-col items-center justify-center border-cyan-500/20">
            <span class="text-[10px] uppercase font-bold tracking-wider text-slate-400 flex items-center gap-1">
                <i class="fa-solid fa-trophy text-amber-400"></i> Рекорд
            </span>
            <span id="highScoreText" class="text-lg sm:text-xl font-black text-amber-400">0</span>
        </div>

        <div class="glass-panel p-2.5 rounded-2xl flex flex-col items-center justify-center border-indigo-500/20">
            <span class="text-[10px] uppercase font-bold tracking-wider text-slate-400 flex items-center gap-1">
                <i class="fa-solid fa-star text-cyan-400"></i> Рахунок
            </span>
            <span id="scoreText" class="text-xl sm:text-2xl font-black text-cyan-400">0</span>
        </div>

        <div class="glass-panel p-2.5 rounded-2xl flex flex-col items-center justify-center border-pink-500/20">
            <span class="text-[10px] uppercase font-bold tracking-wider text-slate-400 flex items-center gap-1">
                <i class="fa-solid fa-bolt text-pink-400"></i> Множник
            </span>
            <span id="multiplierText" class="text-lg sm:text-xl font-black text-pink-400">x1</span>
        </div>
    </div>

    <!-- Main Game Box -->
    <main class="relative w-full max-w-lg aspect-square flex items-center justify-center mb-3">
        <!-- Canvas Element -->
        <canvas id="gameCanvas" class="w-full h-full bg-slate-950/90 border border-slate-800"></canvas>

        <!-- Overlay Screen (Start / Game Over / Pause) -->
        <div id="uiOverlay" class="absolute inset-0 glass-panel rounded-2xl flex flex-col items-center justify-center p-6 text-center z-10 transition-all duration-300">
            <div id="overlayIcon" class="w-20 h-20 rounded-2xl bg-gradient-to-tr from-cyan-500 to-indigo-600 flex items-center justify-center text-4xl mb-4 shadow-xl shadow-indigo-500/40 animate-bounce">
                <i class="fa-solid fa-play text-white ml-1"></i>
            </div>

            <h2 id="overlayTitle" class="text-3xl font-black mb-1 bg-clip-text text-transparent bg-gradient-to-r from-cyan-400 to-indigo-300">
                ГОТОВІ ДО ГРИ?
            </h2>
            <p id="overlaySubtitle" class="text-sm text-slate-300 max-w-xs mb-6">
                Збирайте неонові елементи, уникайте стін і власного хвоста!
            </p>

            <div class="flex flex-col gap-3 w-full max-w-xs">
                <button id="startBtn" class="w-full py-3.5 px-6 rounded-xl font-extrabold text-slate-900 bg-gradient-to-r from-cyan-400 via-teal-300 to-indigo-400 hover:brightness-110 shadow-lg shadow-cyan-500/30 active:scale-95 transition-all text-base tracking-wide flex items-center justify-center gap-2">
                    <i class="fa-solid fa-play"></i> РОЗПОЧАТИ ГРУ
                </button>

                <div class="flex gap-2">
                    <button id="modeBtn" class="flex-1 py-2.5 px-3 rounded-xl glass-panel hover:bg-slate-800/80 text-xs font-bold text-slate-300 transition-all flex items-center justify-center gap-1.5 border-slate-700">
                        <i class="fa-solid fa-cube text-cyan-400"></i> Режим: <span id="modeLabel" class="text-cyan-400">Без стін</span>
                    </button>
                    <button id="skinBtn" class="flex-1 py-2.5 px-3 rounded-xl glass-panel hover:bg-slate-800/80 text-xs font-bold text-slate-300 transition-all flex items-center justify-center gap-1.5 border-slate-700">
                        <i class="fa-solid fa-palette text-pink-400"></i> Скін: <span id="skinLabel" class="text-pink-400">Неон</span>
                    </button>
                </div>
            </div>
        </div>

        <!-- Pause Overlay -->
        <div id="pauseOverlay" class="hidden absolute inset-0 glass-panel rounded-2xl flex flex-col items-center justify-center p-6 text-center z-10">
            <div class="w-16 h-16 rounded-2xl bg-indigo-600/30 border border-indigo-400/40 flex items-center justify-center text-3xl mb-3 text-indigo-300">
                <i class="fa-solid fa-pause"></i>
            </div>
            <h3 class="text-2xl font-black text-white mb-4">ПАУЗА</h3>
            <button id="resumeBtn" class="py-3 px-8 rounded-xl font-bold bg-indigo-600 hover:bg-indigo-500 text-white shadow-lg shadow-indigo-600/30 active:scale-95 transition-all">
                ПРОДОВЖИТИ
            </button>
        </div>
    </main>

    <!-- Controls Bar & On-Screen D-Pad for Mobile -->
    <footer class="w-full max-w-lg flex flex-col items-center gap-3 mb-2">
        <!-- Top Action Buttons -->
        <div class="w-full flex justify-between items-center px-1">
            <div class="text-xs text-slate-400 hidden sm:flex items-center gap-2">
                <span class="px-2 py-1 bg-slate-800 rounded border border-slate-700 font-mono">WASD / Стрілки</span> — Рух
                <span class="px-2 py-1 bg-slate-800 rounded border border-slate-700 font-mono">Space</span> — Пауза
            </div>
            <button id="pauseGameBtn" class="py-2 px-4 rounded-xl glass-panel text-xs font-bold text-slate-300 hover:text-white flex items-center gap-2 ml-auto">
                <i class="fa-solid fa-pause"></i> Пауза
            </button>
        </div>

        <!-- Touch Screen D-Pad (Visible on mobile/touch, optional on desktop) -->
        <div class="grid grid-cols-3 gap-2 w-48 h-48 sm:hidden my-1">
            <div></div>
            <button id="btnUp" class="dpad-btn rounded-2xl flex items-center justify-center text-2xl text-cyan-400 shadow-md">
                <i class="fa-solid fa-caret-up"></i>
            </button>
            <div></div>

            <button id="btnLeft" class="dpad-btn rounded-2xl flex items-center justify-center text-2xl text-cyan-400 shadow-md">
                <i class="fa-solid fa-caret-left"></i>
            </button>
            <div class="flex items-center justify-center text-slate-600 text-xs font-bold">DPAD</div>
            <button id="btnRight" class="dpad-btn rounded-2xl flex items-center justify-center text-2xl text-cyan-400 shadow-md">
                <i class="fa-solid fa-caret-right"></i>
            </button>

            <div></div>
            <button id="btnDown" class="dpad-btn rounded-2xl flex items-center justify-center text-2xl text-cyan-400 shadow-md">
                <i class="fa-solid fa-caret-down"></i>
            </button>
            <div></div>
        </div>
    </footer>

    <!-- GAME LOGIC SCRIPT -->
    <script>
        // Web Audio API Sound Synthesizer (No external assets required!)
        class SoundEngine {
            constructor() {
                this.ctx = null;
                this.enabled = true;
            }

            init() {
                if (!this.ctx) {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    if (AudioContext) {
                        this.ctx = new AudioContext();
                    }
                }
                if (this.ctx && this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
            }

            playEatSound(isSpecial = false) {
                if (!this.enabled) return;
                this.init();
                if (!this.ctx) return;

                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = isSpecial ? 'triangle' : 'sine';
                
                const startFreq = isSpecial ? 520 : 320;
                const endFreq = isSpecial ? 880 : 580;

                osc.frequency.setValueAtTime(startFreq, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(endFreq, this.ctx.currentTime + 0.12);

                gain.gain.setValueAtTime(0.15, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.12);

                osc.connect(gain);
                gain.connect(this.ctx.destination);

                osc.start();
                osc.stop(this.ctx.currentTime + 0.12);
            }

            playGameOverSound() {
                if (!this.enabled) return;
                this.init();
                if (!this.ctx) return;

                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sawtooth';

                osc.frequency.setValueAtTime(220, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(60, this.ctx.currentTime + 0.4);

                gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.4);

                osc.connect(gain);
                gain.connect(this.ctx.destination);

                osc.start();
                osc.stop(this.ctx.currentTime + 0.4);
            }

            playClickSound() {
                if (!this.enabled) return;
                this.init();
                if (!this.ctx) return;

                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(400, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(200, this.ctx.currentTime + 0.05);

                gain.gain.setValueAtTime(0.1, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.05);

                osc.connect(gain);
                gain.connect(this.ctx.destination);

                osc.start();
                osc.stop(this.ctx.currentTime + 0.05);
            }
        }

        const sounds = new SoundEngine();

        // Canvas Setup
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // Grid Configuration
        const GRID_SIZE = 20; // 20x20 Grid
        let cellSize = 0;

        // Game Variables
        let snake = [];
        let dx = 1;
        let dy = 0;
        let nextDx = 1;
        let nextDy = 0;

        let food = { x: 0, y: 0, type: 'regular' }; // 'regular', 'golden', 'speed'
        let particles = [];

        let score = 0;
        let highScore = parseInt(localStorage.getItem('snake_high_score') || '0');
        let multiplier = 1;
        let comboTimer = 0;

        let gameInterval = null;
        let baseSpeed = 110; // ms
        let currentSpeed = baseSpeed;
        let isRunning = false;
        let isPaused = false;

        // Settings
        const MODES = [
            { id: 'pass-through', label: 'Крізь стіни' },
            { id: 'solid-walls', label: 'Бар\'єрний' }
        ];
        let currentModeIndex = 0;

        const SKINS = [
            { id: 'neon', name: 'Неон', head: '#06b6d4', body: '#3b82f6', glow: 'rgba(6, 182, 212, 0.6)' },
            { id: 'cyber', name: 'Кібер', head: '#ec4899', body: '#8b5cf6', glow: 'rgba(236, 72, 153, 0.6)' },
            { id: 'gold', name: 'Золото', head: '#f59e0b', body: '#eab308', glow: 'rgba(245, 158, 11, 0.6)' },
            { id: 'toxic', name: 'Токсик', head: '#10b981', body: '#84cc16', glow: 'rgba(16, 185, 129, 0.6)' }
        ];
        let currentSkinIndex = 0;

        // UI Element References
        const scoreText = document.getElementById('scoreText');
        const highScoreText = document.getElementById('highScoreText');
        const multiplierText = document.getElementById('multiplierText');
        const uiOverlay = document.getElementById('uiOverlay');
        const overlayTitle = document.getElementById('overlayTitle');
        const overlaySubtitle = document.getElementById('overlaySubtitle');
        const overlayIcon = document.getElementById('overlayIcon');
        const startBtn = document.getElementById('startBtn');
        const modeBtn = document.getElementById('modeBtn');
        const modeLabel = document.getElementById('modeLabel');
        const skinBtn = document.getElementById('skinBtn');
        const skinLabel = document.getElementById('skinLabel');
        const pauseOverlay = document.getElementById('pauseOverlay');
        const pauseGameBtn = document.getElementById('pauseGameBtn');
        const resumeBtn = document.getElementById('resumeBtn');
        const soundToggleBtn = document.getElementById('soundToggleBtn');
        const soundIcon = document.getElementById('soundIcon');

        // Render Canvas Sizing
        function resizeCanvas() {
            const container = canvas.parentElement;
            const size = Math.min(container.clientWidth, container.clientHeight);
            canvas.width = size;
            canvas.height = size;
            cellSize = canvas.width / GRID_SIZE;
            if (!isRunning) drawStaticBoard();
        }

        window.addEventListener('resize', resizeCanvas);

        function initGame() {
            // Reset snake in the middle
            const startX = Math.floor(GRID_SIZE / 2);
            const startY = Math.floor(GRID_SIZE / 2);

            snake = [
                { x: startX, y: startY },
                { x: startX - 1, y: startY },
                { x: startX - 2, y: startY }
            ];

            dx = 1;
            dy = 0;
            nextDx = 1;
            nextDy = 0;

            score = 0;
            multiplier = 1;
            comboTimer = 0;
            currentSpeed = baseSpeed;
            particles = [];

            updateScoreUI();
            spawnFood();

            isRunning = true;
            isPaused = false;
            uiOverlay.classList.add('hidden');
            pauseOverlay.classList.add('hidden');

            if (gameInterval) clearInterval(gameInterval);
            gameInterval = setInterval(gameLoop, currentSpeed);
        }

        function spawnFood() {
            let validPos = false;
            let newX, newY;

            while (!validPos) {
                newX = Math.floor(Math.random() * GRID_SIZE);
                newY = Math.floor(Math.random() * GRID_SIZE);

                validPos = !snake.some(segment => segment.x === newX && segment.y === newY);
            }

            // Randomize food type
            const rand = Math.random();
            let type = 'regular';
            if (rand > 0.85) type = 'golden';
            else if (rand > 0.7) type = 'speed';

            food = { x: newX, y: newY, type };
        }

        function gameLoop() {
            if (isPaused) return;

            // Apply buffered directional input
            dx = nextDx;
            dy = nextDy;

            // Calculate new head position
            let headX = snake[0].x + dx;
            let headY = snake[0].y + dy;

            const isSolidWalls = MODES[currentModeIndex].id === 'solid-walls';

            // Wall collisions check
            if (isSolidWalls) {
                if (headX < 0 || headX >= GRID_SIZE || headY < 0 || headY >= GRID_SIZE) {
                    gameOver();
                    return;
                }
            } else {
                // Pass-through wrap around
                if (headX < 0) headX = GRID_SIZE - 1;
                if (headX >= GRID_SIZE) headX = 0;
                if (headY < 0) headY = GRID_SIZE - 1;
                if (headY >= GRID_SIZE) headY = 0;
            }

            // Self collision check
            if (snake.some((segment, idx) => idx !== 0 && segment.x === headX && segment.y === headY)) {
                gameOver();
                return;
            }

            // Move snake
            const newHead = { x: headX, y: headY };
            snake.unshift(newHead);

            // Food collection check
            if (headX === food.x && headY === food.y) {
                handleFoodEaten();
            } else {
                snake.pop(); // Remove tail
            }

            // Handle combo timer
            if (comboTimer > 0) {
                comboTimer--;
                if (comboTimer === 0) multiplier = 1;
                updateScoreUI();
            }

            // Update particles
            updateParticles();

            // Render Frame
            render();
        }

        function handleFoodEaten() {
            let points = 10;
            const skin = SKINS[currentSkinIndex];

            if (food.type === 'golden') {
                points = 30;
                sounds.playEatSound(true);
                createExplosion(food.x, food.y, '#f59e0b');
            } else if (food.type === 'speed') {
                points = 20;
                sounds.playEatSound(true);
                createExplosion(food.x, food.y, '#ec4899');
            } else {
                sounds.playEatSound(false);
                createExplosion(food.x, food.y, skin.head);
            }

            // Combo multiplier increment
            multiplier++;
            comboTimer = 25; // Steps to keep multiplier

            score += points * multiplier;

            if (score > highScore) {
                highScore = score;
                localStorage.setItem('snake_high_score', highScore.toString());
            }

            updateScoreUI();

            // Slightly increase speed as snake grows
            if (currentSpeed > 60 && snake.length % 5 === 0) {
                currentSpeed -= 3;
                clearInterval(gameInterval);
                gameInterval = setInterval(gameLoop, currentSpeed);
            }

            spawnFood();
        }

        function gameOver() {
            isRunning = false;
            clearInterval(gameInterval);
            sounds.playGameOverSound();

            overlayIcon.className = "w-20 h-20 rounded-2xl bg-gradient-to-tr from-pink-500 to-rose-600 flex items-center justify-center text-4xl mb-4 shadow-xl shadow-pink-500/40 animate-pulse";
            overlayIcon.innerHTML = `<i class="fa-solid fa-skull text-white"></i>`;
            overlayTitle.innerText = "ГРА ЗАКІНЧЕНА";
            overlaySubtitle.innerHTML = `Ваш рахунок: <span class="text-cyan-400 font-bold text-lg">${score}</span><br>Рекорд: <span class="text-amber-400 font-bold">${highScore}</span>`;
            startBtn.innerHTML = `<i class="fa-solid fa-rotate-right"></i> ГРАТИ ЗНОВУ`;
            
            uiOverlay.classList.remove('hidden');
        }

        function createExplosion(gridX, gridY, color) {
            const px = (gridX + 0.5) * cellSize;
            const py = (gridY + 0.5) * cellSize;

            for (let i = 0; i < 15; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 4 + 1;
                particles.push({
                    x: px,
                    y: py,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    radius: Math.random() * 3 + 1,
                    alpha: 1,
                    color: color
                });
            }
        }

        function updateParticles() {
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.alpha -= 0.04;
                if (p.alpha <= 0) {
                    particles.splice(i, 1);
                }
            }
        }

        function render() {
            // Clear canvas
            ctx.fillStyle = '#090d16';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw subtle background grid
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.03)';
            ctx.lineWidth = 1;
            for (let i = 0; i <= GRID_SIZE; i++) {
                ctx.beginPath();
                ctx.moveTo(i * cellSize, 0);
                ctx.lineTo(i * cellSize, canvas.height);
                ctx.stroke();

                ctx.beginPath();
                ctx.moveTo(0, i * cellSize);
                ctx.lineTo(canvas.width, i * cellSize);
                ctx.stroke();
            }

            // Draw Food
            const foodPx = food.x * cellSize + cellSize / 2;
            const foodPy = food.y * cellSize + cellSize / 2;
            const radius = (cellSize / 2) * 0.8;

            ctx.save();
            ctx.beginPath();
            ctx.arc(foodPx, foodPy, radius, 0, Math.PI * 2);

            if (food.type === 'golden') {
                ctx.fillStyle = '#f59e0b';
                ctx.shadowColor = '#f59e0b';
                ctx.shadowBlur = 15;
            } else if (food.type === 'speed') {
                ctx.fillStyle = '#ec4899';
                ctx.shadowColor = '#ec4899';
                ctx.shadowBlur = 15;
            } else {
                ctx.fillStyle = '#10b981';
                ctx.shadowColor = '#10b981';
                ctx.shadowBlur = 12;
            }
            ctx.fill();
            ctx.restore();

            // Draw Snake
            const skin = SKINS[currentSkinIndex];

            snake.forEach((segment, index) => {
                const px = segment.x * cellSize;
                const py = segment.y * cellSize;
                const padding = 1.5;
                const size = cellSize - padding * 2;

                ctx.save();
                if (index === 0) {
                    // Snake Head
                    ctx.fillStyle = skin.head;
                    ctx.shadowColor = skin.head;
                    ctx.shadowBlur = 15;
                    
                    // Rounded Head
                    ctx.beginPath();
                    ctx.roundRect(px + padding, py + padding, size, size, size * 0.4);
                    ctx.fill();

                    // Eyes
                    ctx.fillStyle = '#000';
                    const eyeSize = size * 0.18;
                    ctx.beginPath();
                    ctx.arc(px + cellSize * 0.35, py + cellSize * 0.35, eyeSize, 0, Math.PI * 2);
                    ctx.arc(px + cellSize * 0.65, py + cellSize * 0.35, eyeSize, 0, Math.PI * 2);
                    ctx.fill();
                } else {
                    // Snake Body Segment
                    const alpha = 1 - (index / snake.length) * 0.4;
                    ctx.fillStyle = skin.body;
                    ctx.globalAlpha = alpha;

                    ctx.beginPath();
                    ctx.roundRect(px + padding, py + padding, size, size, size * 0.25);
                    ctx.fill();
                }
                ctx.restore();
            });

            // Draw Particles
            particles.forEach(p => {
                ctx.save();
                ctx.globalAlpha = p.alpha;
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            });
        }

        function drawStaticBoard() {
            ctx.fillStyle = '#090d16';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.03)';
            for (let i = 0; i <= GRID_SIZE; i++) {
                ctx.beginPath();
                ctx.moveTo(i * cellSize, 0);
                ctx.lineTo(i * cellSize, canvas.height);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(0, i * cellSize);
                ctx.lineTo(canvas.width, i * cellSize);
                ctx.stroke();
            }
        }

        function updateScoreUI() {
            scoreText.innerText = score;
            highScoreText.innerText = highScore;
            multiplierText.innerText = `x${multiplier}`;
        }

        // Direction Controllers
        function changeDirection(dir) {
            if (!isRunning || isPaused) return;

            if (dir === 'UP' && dy === 0) { nextDx = 0; nextDy = -1; }
            if (dir === 'DOWN' && dy === 0) { nextDx = 0; nextDy = 1; }
            if (dir === 'LEFT' && dx === 0) { nextDx = -1; nextDy = 0; }
            if (dir === 'RIGHT' && dx === 0) { nextDx = 1; nextDy = 0; }
        }

        // Keyboard Event Listener
        window.addEventListener('keydown', (e) => {
            sounds.init();
            switch (e.key) {
                case 'ArrowUp':
                case 'w':
                case 'W':
                case 'ц':
                case 'Ц':
                    changeDirection('UP');
                    e.preventDefault();
                    break;
                case 'ArrowDown':
                case 's':
                case 'S':
                case 'і':
                case 'І':
                    changeDirection('DOWN');
                    e.preventDefault();
                    break;
                case 'ArrowLeft':
                case 'a':
                case 'A':
                case 'ф':
                case 'Ф':
                    changeDirection('LEFT');
                    e.preventDefault();
                    break;
                case 'ArrowRight':
                case 'd':
                case 'D':
                case 'в':
                case 'В':
                    changeDirection('RIGHT');
                    e.preventDefault();
                    break;
                case ' ':
                    togglePause();
                    e.preventDefault();
                    break;
            }
        });

        // Touch Screen Swipes logic
        let touchStartX = 0;
        let touchStartY = 0;

        canvas.addEventListener('touchstart', (e) => {
            touchStartX = e.touches[0].clientX;
            touchStartY = e.touches[0].clientY;
        }, { passive: true });

        canvas.addEventListener('touchend', (e) => {
            if (!touchStartX || !touchStartY) return;

            let touchEndX = e.changedTouches[0].clientX;
            let touchEndY = e.changedTouches[0].clientY;

            let diffX = touchEndX - touchStartX;
            let diffY = touchEndY - touchStartY;

            if (Math.abs(diffX) > Math.abs(diffY)) {
                if (diffX > 20) changeDirection('RIGHT');
                else if (diffX < -20) changeDirection('LEFT');
            } else {
                if (diffY > 20) changeDirection('DOWN');
                else if (diffY < -20) changeDirection('UP');
            }

            touchStartX = 0;
            touchStartY = 0;
        }, { passive: true });

        // On-screen D-Pad buttons
        document.getElementById('btnUp').addEventListener('click', () => changeDirection('UP'));
        document.getElementById('btnDown').addEventListener('click', () => changeDirection('DOWN'));
        document.getElementById('btnLeft').addEventListener('click', () => changeDirection('LEFT'));
        document.getElementById('btnRight').addEventListener('click', () => changeDirection('RIGHT'));

        function togglePause() {
            if (!isRunning) return;
            sounds.playClickSound();
            isPaused = !isPaused;
            if (isPaused) {
                pauseOverlay.classList.remove('hidden');
            } else {
                pauseOverlay.classList.add('hidden');
            }
        }

        // UI Event Listeners
        startBtn.addEventListener('click', () => {
            sounds.playClickSound();
            initGame();
        });

        pauseGameBtn.addEventListener('click', togglePause);
        resumeBtn.addEventListener('click', togglePause);

        modeBtn.addEventListener('click', () => {
            sounds.playClickSound();
            currentModeIndex = (currentModeIndex + 1) % MODES.length;
            modeLabel.innerText = MODES[currentModeIndex].label;
        });

        skinBtn.addEventListener('click', () => {
            sounds.playClickSound();
            currentSkinIndex = (currentSkinIndex + 1) % SKINS.length;
            skinLabel.innerText = SKINS[currentSkinIndex].name;
            if (!isRunning) drawStaticBoard();
        });

        soundToggleBtn.addEventListener('click', () => {
            sounds.enabled = !sounds.enabled;
            if (sounds.enabled) {
                soundIcon.className = "fa-solid fa-volume-high text-cyan-400";
            } else {
                soundIcon.className = "fa-solid fa-volume-xmark text-slate-500";
            }
        });

        // Initialize state on load
        highScoreText.innerText = highScore;
        resizeCanvas();
    </script>
</body>
</html>
